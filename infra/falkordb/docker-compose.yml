services:
  falkordb:
    restart: unless-stopped
    image: falkordb/falkordb:v4.16.3
    environment:
      # --dir /data makes Redis persist dump.rdb onto the mounted volume.
      # Without it FalkorDB writes to /var/lib/falkordb/data (the ephemeral
      # container layer) and every container recreate loses all graphs.
      - REDIS_ARGS=--requirepass ${FALKORDB_PASSWORD} --dir /data
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${FALKORDB_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

volumes:
  falkordb_data:

networks:
  dokploy-network:
    external: true
