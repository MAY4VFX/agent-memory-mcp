services:
  falkordb:
    restart: unless-stopped
    image: falkordb/falkordb:v4.16.3
    environment:
      - REDIS_ARGS=--requirepass ${FALKORDB_PASSWORD}
    volumes:
      # Mount the volume where the FalkorDB image actually writes dump.rdb
      # (its run.sh forces dir=/var/lib/falkordb/data). Mounting elsewhere left
      # snapshots on the ephemeral container layer, so recreates lost all graphs.
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${FALKORDB_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

volumes:
  falkordb_data:

networks:
  dokploy-network:
    external: true
